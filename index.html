<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem AHE - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .page-content { display: none; }
        .page-content.active { display: block; }
    </style>
</head>
<body class="overflow-hidden">

    <!-- ==================== LAYAR LOGIN ==================== -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gray-100 absolute inset-0 z-50">
        <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="fas fa-book-reader text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Sistem AHE</h1>
                <p class="text-sm text-gray-500 mt-1">Silakan login untuk masuk ke Dashboard</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="text" id="username" required class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white transition">
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="password" id="password" required class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white transition">
                    </div>
                </div>
                
                <div id="loginAlert" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 text-center"></div>

                <button type="submit" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-md flex justify-center items-center">
                    <span>Masuk</span>
                </button>
            </form>
            
            <div class="text-center mt-6 text-xs text-gray-400">
                &copy; 2026 Anak Hebat (AHE)
            </div>
        </div>
    </div>


    <!-- ==================== DASHBOARD (Disembunyikan Awalnya) ==================== -->
    <div id="dashboard-screen" class="hidden flex h-screen overflow-hidden">
        
        <!-- Sidebar Kiri -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between">
            <div>
                <!-- Logo & Brand -->
                <div class="h-16 flex items-center px-6 bg-indigo-700 text-white">
                    <i class="fas fa-book-reader text-2xl mr-3"></i>
                    <span class="text-lg font-bold">AHE System</span>
                </div>

                <!-- Menu Navigasi -->
                <div class="px-4 py-6 space-y-1">
                    <p class="px-2 text-xs font-semibold text-gray-400 uppercase tracking-wider mt-2 mb-2">Manajemen</p>
                    <a href="#" onclick="switchPage('siswa', this)" class="menu-btn flex items-center px-4 py-2.5 bg-indigo-50 text-indigo-700 font-medium rounded-lg transition active-menu">
                        <i class="fas fa-user-graduate w-5"></i> Kelola Siswa
                    </a>
                </div>
            </div>

            <!-- Profil Bawah -->
            <div class="border-t border-gray-200 p-4">
                <div class="flex items-center mb-4">
                    <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold" id="profilInisial">A</div>
                    <div class="ml-3 overflow-hidden">
                        <p class="text-sm font-medium text-gray-700 truncate" id="profilNama">Administrator</p>
                        <p class="text-xs text-gray-500">Admin AHE</p>
                    </div>
                </div>
                <button onclick="logout()" class="flex items-center text-red-500 hover:text-red-700 transition w-full px-2">
                    <i class="fas fa-sign-out-alt mr-2"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Konten Utama Kanan -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-gray-50">
            <!-- HALAMAN: KELOLA SISWA -->
            <div id="page-siswa" class="page-content active p-8">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Selamat Datang!</h1>
                        <p class="text-sm text-gray-500">Sistem Informasi Data Siswa AHE siap digunakan.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // GANTI DENGAN URL APPS SCRIPT ANDA
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyct6XL7La4DLPwRwDCcgRSwbupLZqfLkWKFGDp3wlwBIIp1BzmPHGOCajeIhbCWJdLig/exec';

        // Fungsi Login
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnLogin');
            const alertBox = document.getElementById('loginAlert');
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Memeriksa...';
            btn.disabled = true;
            alertBox.classList.add('hidden');

            try {
                // Mengirim request GET ke Google Apps Script
                const response = await fetch(`${APPS_SCRIPT_URL}?action=login&username=${user}&password=${pass}`);
                const result = await response.json();

                if (result.status === "sukses") {
                    // Jika sukses: Sembunyikan Login, Tampilkan Dashboard
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard-screen').classList.remove('hidden');
                    document.getElementById('dashboard-screen').classList.add('flex');
                    
                    // Ubah nama di pojok kiri bawah sesuai Google Sheet
                    document.getElementById('profilNama').innerText = result.nama_admin;
                    document.getElementById('profilInisial').innerText = result.nama_admin.charAt(0);
                    
                    // (Opsional) Simpan sesi login di browser agar kalau di-refresh tidak perlu login lagi
                    sessionStorage.setItem("ahe_logged_in", "true");
                    sessionStorage.setItem("ahe_admin_name", result.nama_admin);
                } else {
                    // Jika gagal (Password salah)
                    alertBox.innerText = result.pesan;
                    alertBox.classList.remove('hidden');
                }
            } catch (error) {
                alertBox.innerText = "Gagal terhubung ke server.";
                alertBox.classList.remove('hidden');
            } finally {
                btn.innerHTML = '<span>Masuk</span>';
                btn.disabled = false;
            }
        });

        // Fungsi Logout
        function logout() {
            sessionStorage.removeItem("ahe_logged_in");
            sessionStorage.removeItem("ahe_admin_name");
            
            // Kembalikan tampilan ke layar login
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('flex');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('loginForm').reset();
        }

        // Fungsi Pindah Halaman Menu (Tetap sama seperti tahap 1)
        function switchPage(pageId, element) {
            document.querySelectorAll('.page-content').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.menu-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-50', 'text-indigo-700', 'font-medium', 'active-menu');
                btn.classList.add('text-gray-700');
            });
            element.classList.remove('text-gray-700');
            element.classList.add('bg-indigo-50', 'text-indigo-700', 'font-medium', 'active-menu');
        }

        // Cek apakah sudah pernah login sebelumnya
        window.onload = function() {
            if(sessionStorage.getItem("ahe_logged_in") === "true") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                document.getElementById('dashboard-screen').classList.add('flex');
                
                let nama = sessionStorage.getItem("ahe_admin_name");
                document.getElementById('profilNama').innerText = nama;
                document.getElementById('profilInisial').innerText = nama.charAt(0);
            }
        }
    </script>
</body>
</html>
